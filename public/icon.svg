<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- Background Gradient (Rich Royal Khalsa Blue with subtle depth) -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00469E"/>
      <stop offset="45%" stop-color="#003580"/>
      <stop offset="100%" stop-color="#00215E"/>
    </linearGradient>

    <!-- Punjab Map Vibrant Golden Yellow Gradient -->
    <linearGradient id="punjabYellow" x1="10%" y1="0%" x2="90%" y2="100%">
      <stop offset="0%" stop-color="#FFF533"/>
      <stop offset="35%" stop-color="#FFDD00"/>
      <stop offset="85%" stop-color="#F2B705"/>
      <stop offset="100%" stop-color="#D99B00"/>
    </linearGradient>

    <!-- Punjab Map 3D Bevel Highlight -->
    <linearGradient id="punjabHighlight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFB3"/>
      <stop offset="100%" stop-color="#FFD000"/>
    </linearGradient>

    <!-- Canadian Maple Leaf 3D Crimson Red Gradient -->
    <radialGradient id="mapleRedGrad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#FF2438"/>
      <stop offset="60%" stop-color="#E1061A"/>
      <stop offset="100%" stop-color="#9E000F"/>
    </radialGradient>

    <!-- Cloud Soft White Gradient -->
    <linearGradient id="cloudGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="70%" stop-color="#F3F7FC"/>
      <stop offset="100%" stop-color="#D2E3F4"/>
    </linearGradient>

    <!-- Wheat Grain Gold -->
    <linearGradient id="wheatGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF2B8"/>
      <stop offset="40%" stop-color="#E8C374"/>
      <stop offset="100%" stop-color="#A87A2C"/>
    </linearGradient>

    <!-- Wheat Green Leaves at Base -->
    <linearGradient id="wheatGreen" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#80E89B"/>
      <stop offset="50%" stop-color="#4CB86C"/>
      <stop offset="100%" stop-color="#24783E"/>
    </linearGradient>

    <!-- Soft Drop Shadow Filter for Elements -->
    <filter id="elementShadow" x="-15%" y="-15%" width="135%" height="135%">
      <feDropShadow dx="3" dy="8" stdDeviation="12" flood-color="#001138" flood-opacity="0.6"/>
    </filter>

    <!-- Deep Inset Bevel Shadow for 3D Maple Leaf & Map -->
    <filter id="leafBevel" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="2" dy="6" stdDeviation="8" flood-color="#000E2B" flood-opacity="0.55"/>
    </filter>
  </defs>

  <!-- ======================================================== -->
  <!-- 0. BASE SQUIRCLE APP CONTAINER                           -->
  <!-- ======================================================== -->
  <!-- Outer squircle -->
  <rect x="12" y="12" width="1000" height="1000" rx="224" ry="224" fill="url(#bgGrad)"/>
  
  <!-- Subtle border bevel stroke -->
  <rect x="14" y="14" width="996" height="996" rx="222" ry="222" fill="none" stroke="#1D68D8" stroke-width="6" stroke-opacity="0.55"/>
  <rect x="20" y="20" width="984" height="984" rx="216" ry="216" fill="none" stroke="#00184A" stroke-width="4" stroke-opacity="0.4"/>

  <!-- ======================================================== -->
  <!-- 1. PUNJAB MAP (Top Left)                                  -->
  <!-- ======================================================== -->
  <g filter="url(#elementShadow)">
    <!-- Base 3D Border Ridge for Punjab Map -->
    <path d="M 416 88
             C 426 78, 438 82, 442 96
             C 446 108, 440 120, 426 128
             C 406 138, 402 152, 414 170
             C 434 196, 458 244, 474 282
             C 484 306, 506 318, 522 310
             C 536 302, 550 312, 560 330
             C 570 352, 558 370, 546 382
             C 530 398, 538 418, 558 430
             C 576 442, 580 458, 572 476
             C 560 500, 536 518, 510 532
             C 482 548, 462 568, 454 598
             C 446 620, 430 632, 410 628
             C 390 624, 382 640, 382 658
             C 380 672, 366 680, 350 676
             C 334 668, 324 648, 312 652
             C 298 658, 286 644, 278 624
             C 270 604, 254 598, 230 600
             C 196 604, 170 584, 158 552
             C 146 520, 122 508, 94 508
             C 76 508, 70 492, 82 478
             C 96 460, 122 436, 138 408
             C 162 364, 184 324, 190 278
             C 194 240, 206 212, 236 196
             C 262 182, 296 164, 326 148
             C 362 128, 394 114, 416 88 Z"
          fill="url(#punjabYellow)"
          stroke="#FFF785"
          stroke-width="12"
          stroke-linejoin="round"
          stroke-linecap="round"/>

    <!-- Punjab Map 3D Inner Emboss Highlights -->
    <path d="M 416 102
             C 424 116, 410 148, 424 178
             C 446 226, 480 286, 512 308
             C 532 320, 542 352, 532 384
             C 522 414, 542 444, 524 484
             C 494 514, 464 534, 444 574"
          fill="none"
          stroke="#FFFCC4"
          stroke-width="7"
          stroke-linecap="round"
          opacity="0.75"/>

    <!-- Subtle darker bevel ridge on the south-west edge -->
    <path d="M 100 500 C 130 500, 150 514, 160 546 C 172 578, 198 596, 232 592 C 256 590, 272 596, 280 616"
          fill="none"
          stroke="#D49300"
          stroke-width="6"
          stroke-linecap="round"
          opacity="0.5"/>
  </g>

  <!-- ======================================================== -->
  <!-- 2. CLOUD & 6 SNOWFLAKES (Top Right)                      -->
  <!-- ======================================================== -->
  <g filter="url(#elementShadow)">
    <!-- Main Fluffy Cloud Shape -->
    <path d="M 720 275
             L 860 275
             A 52 52 0 0 0 900 198
             A 68 68 0 0 0 826 98
             A 84 84 0 0 0 690 130
             A 60 60 0 0 0 634 202
             A 52 52 0 0 0 666 275
             Z"
          fill="url(#cloudGrad)"/>

    <!-- Cloud Soft Bottom Shadow for 3D Puffy Depth -->
    <path d="M 666 264
             L 870 264
             A 40 40 0 0 0 894 224
             C 870 252, 690 256, 666 264 Z"
          fill="#AECDEB" opacity="0.65"/>

    <!-- 6 Crisp 6-Pointed Snowflakes (2 Staggered Rows) -->
    <!-- Row 1 (Top: 3 Snowflakes) -->
    <g stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" fill="none">
      <!-- Snowflake 1 (Left) -->
      <g transform="translate(696, 326) scale(1.15)">
        <line x1="0" y1="-17" x2="0" y2="17"/>
        <line x1="-14.7" y1="-8.5" x2="14.7" y2="8.5"/>
        <line x1="-14.7" y1="8.5" x2="14.7" y2="-8.5"/>
        <circle cx="0" cy="0" r="3.5" fill="#FFFFFF"/>
      </g>

      <!-- Snowflake 2 (Center) -->
      <g transform="translate(764, 322) scale(1.15)">
        <line x1="0" y1="-17" x2="0" y2="17"/>
        <line x1="-14.7" y1="-8.5" x2="14.7" y2="8.5"/>
        <line x1="-14.7" y1="8.5" x2="14.7" y2="-8.5"/>
        <circle cx="0" cy="0" r="3.5" fill="#FFFFFF"/>
      </g>

      <!-- Snowflake 3 (Right) -->
      <g transform="translate(832, 326) scale(1.15)">
        <line x1="0" y1="-17" x2="0" y2="17"/>
        <line x1="-14.7" y1="-8.5" x2="14.7" y2="8.5"/>
        <line x1="-14.7" y1="8.5" x2="14.7" y2="-8.5"/>
        <circle cx="0" cy="0" r="3.5" fill="#FFFFFF"/>
      </g>

      <!-- Row 2 (Bottom: 3 Snowflakes) -->
      <!-- Snowflake 4 (Left) -->
      <g transform="translate(672, 376) scale(1.05)">
        <line x1="0" y1="-17" x2="0" y2="17"/>
        <line x1="-14.7" y1="-8.5" x2="14.7" y2="8.5"/>
        <line x1="-14.7" y1="8.5" x2="14.7" y2="-8.5"/>
        <circle cx="0" cy="0" r="3.5" fill="#FFFFFF"/>
      </g>

      <!-- Snowflake 5 (Center) -->
      <g transform="translate(738, 372) scale(1.05)">
        <line x1="0" y1="-17" x2="0" y2="17"/>
        <line x1="-14.7" y1="-8.5" x2="14.7" y2="8.5"/>
        <line x1="-14.7" y1="8.5" x2="14.7" y2="-8.5"/>
        <circle cx="0" cy="0" r="3.5" fill="#FFFFFF"/>
      </g>

      <!-- Snowflake 6 (Right) -->
      <g transform="translate(806, 376) scale(1.05)">
        <line x1="0" y1="-17" x2="0" y2="17"/>
        <line x1="-14.7" y1="-8.5" x2="14.7" y2="8.5"/>
        <line x1="-14.7" y1="8.5" x2="14.7" y2="-8.5"/>
        <circle cx="0" cy="0" r="3.5" fill="#FFFFFF"/>
      </g>
    </g>
  </g>

  <!-- ======================================================== -->
  <!-- 3. CANADIAN MAPLE LEAF (Bottom Right)                    -->
  <!-- ======================================================== -->
  <g filter="url(#leafBevel)">
    <!-- 11-Point Canadian Maple Leaf Silhouette with 3D Bevel -->
    <path d="M 705 442
             L 730 542 L 778 518 L 760 578 L 848 602 L 948 704 L 864 728 L 884 794 L 772 760 L 720 842
             L 716 950 L 694 950 L 690 842 L 638 760 L 526 794 L 546 728 L 462 704 L 562 602 L 544 578 L 526 518 L 574 542 L 599 442
             L 652 548 Z"
          fill="url(#mapleRedGrad)"
          stroke="#FF4757"
          stroke-width="6"
          stroke-linejoin="round"/>

    <!-- Maple Leaf 3D Raised Vein Ridges & Specular Highlights -->
    <g stroke="#FFA3AC" stroke-width="4.5" stroke-linecap="round" fill="none" opacity="0.65">
      <!-- Main Central Spine -->
      <line x1="705" y1="450" x2="705" y2="838"/>
      <!-- Right Main Vein -->
      <line x1="705" y1="690" x2="900" y2="708"/>
      <!-- Left Main Vein -->
      <line x1="705" y1="690" x2="510" y2="708"/>
      <!-- Upper Right Diagonal Vein -->
      <line x1="705" y1="630" x2="784" y2="532"/>
      <!-- Upper Left Diagonal Vein -->
      <line x1="705" y1="630" x2="626" y2="532"/>
    </g>
  </g>

  <!-- ======================================================== -->
  <!-- 4. GOLDEN WHEAT STALKS (Bottom Left)                     -->
  <!-- ======================================================== -->
  <g filter="url(#elementShadow)" transform="translate(85, 620) rotate(-16)">
    <!-- Wheat Stalk 1 (Longer Upper Stalk) -->
    <g transform="translate(0, 0)">
      <!-- Central stem -->
      <path d="M 40 170 Q 140 100 290 20" fill="none" stroke="#DCA842" stroke-width="6" stroke-linecap="round"/>
      
      <!-- Wheat Grains with Awns/Beards -->
      <!-- Grains Pair 1 -->
      <path d="M 90 136 C 80 120, 96 104, 116 112 C 108 132, 96 140, 90 136 Z" fill="url(#wheatGold)" stroke="#694600" stroke-width="1.6"/>
      <path d="M 104 148 C 108 128, 128 124, 136 140 C 124 152, 108 156, 104 148 Z" fill="url(#wheatGold)" stroke="#694600" stroke-width="1.6"/>
      <line x1="90" y1="120" x2="70" y2="90" stroke="#FCE297" stroke-width="2.5"/>
      
      <!-- Grains Pair 2 -->
      <path d="M 136 104 C 126 88, 142 72, 162 80 C 154 100, 142 108, 136 104 Z" fill="url(#wheatGold)" stroke="#694600" stroke-width="1.6"/>
      <path d="M 150 116 C 154 96, 174 92, 182 108 C 170 120, 154 124, 150 116 Z" fill="url(#wheatGold)" stroke="#694600" stroke-width="1.6"/>
      <line x1="136" y1="88" x2="116" y2="56" stroke="#FCE297" stroke-width="2.5"/>

      <!-- Grains Pair 3 -->
      <path d="M 182 72 C 172 56, 188 40, 208 48 C 200 68, 188 76, 182 72 Z" fill="url(#wheatGold)" stroke="#694600" stroke-width="1.6"/>
      <path d="M 196 84 C 200 64, 220 60, 228 76 C 216 88, 200 92, 196 84 Z" fill="url(#wheatGold)" stroke="#694600" stroke-width="1.6"/>
      <line x1="182" y1="56" x2="162" y2="24" stroke="#FCE297" stroke-width="2.5"/>

      <!-- Grains Tip -->
      <path d="M 228 40 C 218 24, 234 8, 254 16 C 246 36, 234 44, 228 40 Z" fill="url(#wheatGold)" stroke="#694600" stroke-width="1.6"/>
      <path d="M 242 52 C 246 32, 266 28, 274 44 C 262 56, 246 60, 242 52 Z" fill="url(#wheatGold)" stroke="#694600" stroke-width="1.6"/>
      <path d="M 272 20 C 276 4, 296 8, 292 24 C 284 32, 272 28, 272 20 Z" fill="url(#wheatGold)" stroke="#694600" stroke-width="1.6"/>
      <line x1="228" y1="24" x2="210" y2="-4" stroke="#FCE297" stroke-width="2.5"/>
      <line x1="272" y1="10" x2="284" y2="-24" stroke="#FCE297" stroke-width="2.5"/>
    </g>

    <!-- Wheat Stalk 2 (Lower Stalk) -->
    <g transform="translate(36, 52)">
      <!-- Central stem -->
      <path d="M 30 150 Q 120 90 260 20" fill="none" stroke="#DCA842" stroke-width="5" stroke-linecap="round"/>
      
      <!-- Wheat Grains -->
      <path d="M 76 120 C 66 104, 82 88, 102 96 C 94 116, 82 124, 76 120 Z" fill="url(#wheatGold)" stroke="#694600" stroke-width="1.4"/>
      <path d="M 90 132 C 94 112, 114 108, 122 124 C 110 136, 94 140, 90 132 Z" fill="url(#wheatGold)" stroke="#694600" stroke-width="1.4"/>
      
      <path d="M 120 88 C 110 72, 126 56, 146 64 C 138 84, 126 92, 120 88 Z" fill="url(#wheatGold)" stroke="#694600" stroke-width="1.4"/>
      <path d="M 134 100 C 138 80, 158 76, 166 92 C 154 104, 138 108, 134 100 Z" fill="url(#wheatGold)" stroke="#694600" stroke-width="1.4"/>

      <path d="M 164 56 C 154 40, 170 24, 190 32 C 182 52, 170 60, 164 56 Z" fill="url(#wheatGold)" stroke="#694600" stroke-width="1.4"/>
      <path d="M 178 68 C 182 48, 202 44, 210 60 C 198 72, 182 76, 178 68 Z" fill="url(#wheatGold)" stroke="#694600" stroke-width="1.4"/>

      <path d="M 208 24 C 198 8, 214 -8, 234 0 C 226 20, 214 28, 208 24 Z" fill="url(#wheatGold)" stroke="#694600" stroke-width="1.4"/>
      <path d="M 240 8 C 244 -8, 260 -4, 256 12 C 248 20, 240 16, 240 8 Z" fill="url(#wheatGold)" stroke="#694600" stroke-width="1.4"/>
      <line x1="164" y1="40" x2="144" y2="12" stroke="#FCE297" stroke-width="2.5"/>
      <line x1="240" y1="0" x2="256" y2="-24" stroke="#FCE297" stroke-width="2.5"/>
    </g>

    <!-- Green Leaf Sheaths Wrapping the Base -->
    <path d="M 30 210 C 60 170, 120 140, 150 190 C 100 220, 50 240, 30 210 Z" fill="url(#wheatGreen)" stroke="#1B6932" stroke-width="2"/>
    <path d="M 20 230 C 44 180, 90 156, 110 210 C 70 250, 40 256, 20 230 Z" fill="url(#wheatGreen)" stroke="#1B6932" stroke-width="2"/>
  </g>
</svg>
