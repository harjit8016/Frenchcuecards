<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0047AB"/>
      <stop offset="60%" stop-color="#002D80"/>
      <stop offset="100%" stop-color="#001C55"/>
    </linearGradient>

    <!-- Punjab Map Gold Gradient -->
    <linearGradient id="punjabGold" x1="0%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#FFF066"/>
      <stop offset="40%" stop-color="#FFCC00"/>
      <stop offset="100%" stop-color="#E5A700"/>
    </linearGradient>

    <!-- Maple Leaf Red Gradient with Emboss Feel -->
    <linearGradient id="mapleRed" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#FF2E3E"/>
      <stop offset="50%" stop-color="#E60D1F"/>
      <stop offset="100%" stop-color="#A8000C"/>
    </linearGradient>

    <!-- Cloud Gradient -->
    <linearGradient id="cloudGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#D7E5F5"/>
    </linearGradient>

    <!-- Wheat Gold Gradient -->
    <linearGradient id="wheatGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE8A3"/>
      <stop offset="50%" stop-color="#E5BE6C"/>
      <stop offset="100%" stop-color="#A5792F"/>
    </linearGradient>

    <!-- Wheat Leaf Green -->
    <linearGradient id="wheatGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6EDC88"/>
      <stop offset="100%" stop-color="#2D8C47"/>
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <filter id="elementShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="5" stdDeviation="6" flood-color="#000D2B" flood-opacity="0.5"/>
    </filter>
    <filter id="punjabOutlineGlow">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#FFE57F" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- Squircle App Icon Container -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <!-- Subtle border stroke -->
  <rect x="2" y="2" width="508" height="508" rx="110" fill="none" stroke="#2563EB" stroke-width="4" stroke-opacity="0.4"/>

  <!-- ======================================================== -->
  <!-- 1. PUNJAB MAP (Top Left)                                  -->
  <!-- ======================================================== -->
  <g filter="url(#elementShadow)">
    <!-- Outer boundary glow/stroke for Punjab map -->
    <path d="M 215 48
             C 219 44, 224 45, 227 50
             C 230 55, 227 60, 220 63
             C 210 68, 208 75, 214 83
             C 225 96, 238 120, 245 138
             C 250 150, 260 156, 268 152
             C 275 148, 282 153, 287 162
             C 292 173, 286 182, 280 188
             C 272 195, 276 205, 286 211
             C 295 217, 297 225, 293 234
             C 287 246, 275 255, 262 262
             C 248 270, 238 280, 234 295
             C 230 306, 222 312, 212 310
             C 202 308, 198 316, 198 325
             C 197 332, 190 336, 182 334
             C 174 330, 169 320, 163 322
             C 156 325, 150 318, 146 308
             C 142 298, 134 295, 122 296
             C 105 298, 92 288, 86 272
             C 80 256, 68 250, 54 250
             C 45 250, 42 242, 48 235
             C 55 226, 68 214, 76 200
             C 88 178, 99 158, 102 135
             C 104 116, 110 102, 125 94
             C 138 87, 155 78, 170 70
             C 188 60, 204 53, 215 48 Z"
          fill="url(#punjabGold)"
          stroke="#FFF89A"
          stroke-width="5"
          stroke-linejoin="round"
          stroke-linecap="round"/>
          
    <!-- Punjab 3D bevel / ridge highlights -->
    <path d="M 215 54 C 220 60, 210 75, 218 90 C 230 115, 248 145, 265 156 C 275 162, 280 178, 275 195 C 270 210, 280 225, 270 245 C 255 260, 240 270, 230 290"
          fill="none"
          stroke="#FFEB7A"
          stroke-width="3"
          stroke-linecap="round"
          opacity="0.7"/>
  </g>

  <!-- ======================================================== -->
  <!-- 2. CLOUD & SNOWFLAKES (Top Right)                        -->
  <!-- ======================================================== -->
  <g filter="url(#elementShadow)">
    <!-- Fluffy Cloud -->
    <path d="M 370 144
             L 435 144
             A 26 26 0 0 0 455 106
             A 34 34 0 0 0 418 56
             A 42 42 0 0 0 350 72
             A 30 30 0 0 0 322 108
             A 26 26 0 0 0 338 144
             Z"
          fill="url(#cloudGrad)"/>
    <!-- Cloud base shadow/highlight -->
    <path d="M 338 138 L 440 138 A 20 20 0 0 0 452 118 C 440 132, 350 134, 338 138 Z"
          fill="#B8D0EB" opacity="0.6"/>

    <!-- Snowflakes (Crisp Asterisks) -->
    <!-- Row 1 -->
    <g stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" fill="none">
      <!-- Snowflake 1 -->
      <g transform="translate(348, 172) scale(0.9)">
        <line x1="0" y1="-12" x2="0" y2="12"/>
        <line x1="-10.4" y1="-6" x2="10.4" y2="6"/>
        <line x1="-10.4" y1="6" x2="10.4" y2="-6"/>
        <circle cx="0" cy="0" r="2.5" fill="#FFFFFF"/>
      </g>
      <!-- Snowflake 2 -->
      <g transform="translate(388, 170) scale(0.9)">
        <line x1="0" y1="-12" x2="0" y2="12"/>
        <line x1="-10.4" y1="-6" x2="10.4" y2="6"/>
        <line x1="-10.4" y1="6" x2="10.4" y2="-6"/>
        <circle cx="0" cy="0" r="2.5" fill="#FFFFFF"/>
      </g>
      <!-- Snowflake 3 -->
      <g transform="translate(426, 172) scale(0.9)">
        <line x1="0" y1="-12" x2="0" y2="12"/>
        <line x1="-10.4" y1="-6" x2="10.4" y2="6"/>
        <line x1="-10.4" y1="6" x2="10.4" y2="-6"/>
        <circle cx="0" cy="0" r="2.5" fill="#FFFFFF"/>
      </g>
      <!-- Row 2 -->
      <!-- Snowflake 4 -->
      <g transform="translate(340, 202) scale(0.85)">
        <line x1="0" y1="-12" x2="0" y2="12"/>
        <line x1="-10.4" y1="-6" x2="10.4" y2="6"/>
        <line x1="-10.4" y1="6" x2="10.4" y2="-6"/>
        <circle cx="0" cy="0" r="2.5" fill="#FFFFFF"/>
      </g>
      <!-- Snowflake 5 -->
      <g transform="translate(376, 200) scale(0.85)">
        <line x1="0" y1="-12" x2="0" y2="12"/>
        <line x1="-10.4" y1="-6" x2="10.4" y2="6"/>
        <line x1="-10.4" y1="6" x2="10.4" y2="-6"/>
        <circle cx="0" cy="0" r="2.5" fill="#FFFFFF"/>
      </g>
      <!-- Snowflake 6 -->
      <g transform="translate(412, 202) scale(0.85)">
        <line x1="0" y1="-12" x2="0" y2="12"/>
        <line x1="-10.4" y1="-6" x2="10.4" y2="6"/>
        <line x1="-10.4" y1="6" x2="10.4" y2="-6"/>
        <circle cx="0" cy="0" r="2.5" fill="#FFFFFF"/>
      </g>
    </g>
  </g>

  <!-- ======================================================== -->
  <!-- 3. CANADIAN MAPLE LEAF (Bottom Right)                    -->
  <!-- ======================================================== -->
  <g filter="url(#elementShadow)">
    <!-- Maple Leaf Silhouette with 11 Iconic Points -->
    <path d="M 360 236
             L 373 286 L 398 274 L 388 304 L 434 316 L 485 368 L 442 380 L 452 414 L 395 396 L 368 438
             L 366 490 L 354 490 L 352 438 L 325 396 L 268 414 L 278 380 L 235 368 L 286 316 L 276 304 L 266 274 L 291 286 L 304 236
             L 332 290 Z"
          fill="url(#mapleRed)"
          stroke="#FF5765"
          stroke-width="3"
          stroke-linejoin="round"/>
          
    <!-- Maple Leaf 3D Center Ridges / Highlights -->
    <path d="M 360 240 L 360 435 M 360 360 L 460 370 M 360 360 L 260 370 M 360 330 L 400 280 M 360 330 L 320 280"
          fill="none"
          stroke="#FF8A95"
          stroke-width="2.5"
          stroke-linecap="round"
          opacity="0.6"/>
  </g>

  <!-- ======================================================== -->
  <!-- 4. GOLDEN WHEAT STALKS (Bottom Left)                     -->
  <!-- ======================================================== -->
  <g filter="url(#elementShadow)" transform="translate(40, 310) rotate(-12)">
    <!-- Wheat Stalk 1 (Upper/Longer) -->
    <g transform="translate(0, 0)">
      <!-- Central stem -->
      <path d="M 20 85 Q 70 50 145 10" fill="none" stroke="#D5A440" stroke-width="3" stroke-linecap="round"/>
      
      <!-- Wheat Grains (Awns/Spikelets) -->
      <!-- Pair 1 -->
      <path d="M 45 68 C 40 60, 48 52, 58 56 C 54 66, 48 70, 45 68 Z" fill="url(#wheatGold)" stroke="#6B4800" stroke-width="0.8"/>
      <path d="M 52 74 C 54 64, 64 62, 68 70 C 62 76, 54 78, 52 74 Z" fill="url(#wheatGold)" stroke="#6B4800" stroke-width="0.8"/>
      <line x1="45" y1="60" x2="35" y2="45" stroke="#E5BE6C" stroke-width="1.2"/>
      
      <!-- Pair 2 -->
      <path d="M 68 52 C 63 44, 71 36, 81 40 C 77 50, 71 54, 68 52 Z" fill="url(#wheatGold)" stroke="#6B4800" stroke-width="0.8"/>
      <path d="M 75 58 C 77 48, 87 46, 91 54 C 85 60, 77 62, 75 58 Z" fill="url(#wheatGold)" stroke="#6B4800" stroke-width="0.8"/>
      <line x1="68" y1="44" x2="58" y2="28" stroke="#E5BE6C" stroke-width="1.2"/>

      <!-- Pair 3 -->
      <path d="M 91 36 C 86 28, 94 20, 104 24 C 100 34, 94 38, 91 36 Z" fill="url(#wheatGold)" stroke="#6B4800" stroke-width="0.8"/>
      <path d="M 98 42 C 100 32, 110 30, 114 38 C 108 44, 100 46, 98 42 Z" fill="url(#wheatGold)" stroke="#6B4800" stroke-width="0.8"/>
      <line x1="91" y1="28" x2="81" y2="12" stroke="#E5BE6C" stroke-width="1.2"/>

      <!-- Pair 4 (Tip) -->
      <path d="M 114 20 C 109 12, 117 4, 127 8 C 123 18, 117 22, 114 20 Z" fill="url(#wheatGold)" stroke="#6B4800" stroke-width="0.8"/>
      <path d="M 121 26 C 123 16, 133 14, 137 22 C 131 28, 123 30, 121 26 Z" fill="url(#wheatGold)" stroke="#6B4800" stroke-width="0.8"/>
      <path d="M 136 10 C 138 2, 148 4, 146 12 C 142 16, 136 14, 136 10 Z" fill="url(#wheatGold)" stroke="#6B4800" stroke-width="0.8"/>
      <line x1="114" y1="12" x2="105" y2="-2" stroke="#E5BE6C" stroke-width="1.2"/>
      <line x1="136" y1="5" x2="142" y2="-12" stroke="#E5BE6C" stroke-width="1.2"/>
    </g>

    <!-- Wheat Stalk 2 (Lower) -->
    <g transform="translate(18, 26)">
      <!-- Central stem -->
      <path d="M 15 75 Q 60 45 130 10" fill="none" stroke="#D5A440" stroke-width="2.5" stroke-linecap="round"/>
      
      <!-- Wheat Grains -->
      <path d="M 38 60 C 33 52, 41 44, 51 48 C 47 58, 41 62, 38 60 Z" fill="url(#wheatGold)" stroke="#6B4800" stroke-width="0.7"/>
      <path d="M 45 66 C 47 56, 57 54, 61 62 C 55 68, 47 70, 45 66 Z" fill="url(#wheatGold)" stroke="#6B4800" stroke-width="0.7"/>
      
      <path d="M 60 44 C 55 36, 63 28, 73 32 C 69 42, 63 46, 60 44 Z" fill="url(#wheatGold)" stroke="#6B4800" stroke-width="0.7"/>
      <path d="M 67 50 C 69 40, 79 38, 83 46 C 77 52, 69 54, 67 50 Z" fill="url(#wheatGold)" stroke="#6B4800" stroke-width="0.7"/>

      <path d="M 82 28 C 77 20, 85 12, 95 16 C 91 26, 85 30, 82 28 Z" fill="url(#wheatGold)" stroke="#6B4800" stroke-width="0.7"/>
      <path d="M 89 34 C 91 24, 101 22, 105 30 C 99 36, 91 38, 89 34 Z" fill="url(#wheatGold)" stroke="#6B4800" stroke-width="0.7"/>

      <path d="M 104 12 C 99 4, 107 -4, 117 0 C 113 10, 107 14, 104 12 Z" fill="url(#wheatGold)" stroke="#6B4800" stroke-width="0.7"/>
      <path d="M 120 4 C 122 -4, 130 -2, 128 6 C 124 10, 120 8, 120 4 Z" fill="url(#wheatGold)" stroke="#6B4800" stroke-width="0.7"/>
      <line x1="82" y1="20" x2="72" y2="6" stroke="#E5BE6C" stroke-width="1.2"/>
      <line x1="120" y1="0" x2="128" y2="-12" stroke="#E5BE6C" stroke-width="1.2"/>
    </g>

    <!-- Green Leaf Sheaths at Base -->
    <path d="M 15 105 C 30 85, 60 70, 75 95 C 50 110, 25 120, 15 105 Z" fill="url(#wheatGreen)" stroke="#1E6B34" stroke-width="1"/>
    <path d="M 10 115 C 22 90, 45 78, 55 105 C 35 125, 20 128, 10 115 Z" fill="url(#wheatGreen)" stroke="#1E6B34" stroke-width="1"/>
  </g>
</svg>
