<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0033A0"/>
      <stop offset="100%" stop-color="#001B54"/>
    </linearGradient>
    <linearGradient id="kesariGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFB347"/>
      <stop offset="50%" stop-color="#FF9933"/>
      <stop offset="100%" stop-color="#E67A15"/>
    </linearGradient>
    <filter id="yellowGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#FFD700" flood-opacity="0.45"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#blueGrad)"/>
  <rect x="24" y="24" width="464" height="464" rx="88" fill="none" stroke="#FFD700" stroke-width="4" stroke-opacity="0.3"/>
  <circle cx="256" cy="256" r="160" fill="url(#kesariGrad)" filter="url(#yellowGlow)"/>
  
  <!-- Stylized F + Punjabi Letter ਕ (K) / Kiu symbol -->
  <text x="256" y="280" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="900" font-size="140" fill="#002270" text-anchor="middle" dominant-baseline="middle">FK</text>
  <path d="M190 370 Q256 400 322 370" fill="none" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round"/>
</svg>
